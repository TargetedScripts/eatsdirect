<!DOCTYPE html>
<html lang="en-NZ" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EatsDirect NZ — Order Direct from Local Eateries (0% Commission)</title>
  <meta name="description" content="Discover local cafes, takeaways, and restaurants across New Zealand. Filter by Open Now, Dine-In, or Takeaway and order direct with zero third-party commission." />
  <link rel="icon" type="image/png" href="assets/images/edlogo.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0f172a',
              card: '#1e293b',
              amber: '#f59e0b',
              emerald: '#10b981'
            }
          }
        }
      }
    };
  </script>

  <!-- Firebase Compat SDK v9.22.0 (Siap diaktifkan saat collection Firestore siap) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    /* Custom scrollbar untuk filter horizontal di layar HP */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- TOP NAVIGATION HEADER -->
  <header class="sticky top-0 z-40 bg-brand-dark/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <!-- Brand Logo -->
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <img src="assets/images/edlogo.png" alt="EatsDirect NZ" class="h-8 sm:h-9 w-auto object-contain" />
      </a>

      <!-- Right Actions: City Selector + List Business CTA -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="relative">
          <select id="cityFilter" aria-label="Select City" class="bg-brand-card border border-slate-700 text-slate-200 text-xs sm:text-sm rounded-lg px-2.5 py-2 focus:outline-none focus:border-brand-emerald cursor-pointer">
            <option value="All">All NZ Cities</option>
            <option value="Palmerston North" selected>Palmerston North</option>
            <option value="Feilding">Feilding</option>
            <option value="Wellington">Wellington</option>
            <option value="Auckland">Auckland</option>
          </select>
        </div>

        <button onclick="openPricingModal()" class="bg-brand-emerald hover:bg-emerald-400 text-slate-950 font-semibold text-xs sm:text-sm px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap">
          + List Your Business
        </button>
      </div>
    </div>
  </header>

  <!-- HERO & SMART SEARCH SECTION -->
  <section class="bg-gradient-to-b from-slate-900 to-brand-dark border-b border-slate-800/80 pt-7 pb-6 px-4">
    <div class="max-w-4xl mx-auto text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-brand-emerald text-xs font-medium mb-3">
        <span>🇳🇿 Supporting Local Kiwi Hospitality • 0% Commission Direct</span>
      </div>
      <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
        Find Local Eats &amp; <span class="text-brand-amber">Order Direct</span>
      </h1>
      <p class="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto mb-5">
        See who’s open right now in your town. Browse menus, filter by dine-in or takeaway, and order straight from the venue without heavy app fees.
      </p>

      <!-- Search Bar -->
      <div class="max-w-2xl mx-auto relative">
        <input
          type="text"
          id="searchInput"
          placeholder="Search cafe, fish & chips, Thai, coffee, bakery..."
          class="w-full bg-brand-card border border-slate-700 focus:border-brand-amber rounded-xl pl-4 pr-10 py-3 text-sm text-white placeholder-slate-400 focus:outline-none shadow-lg"
        />
        <span class="absolute right-3.5 top-3 text-slate-400 text-base">🔍</span>
      </div>

      <!-- Live NZ Clock Indicator -->
      <div class="mt-3 text-xs text-slate-400 flex items-center justify-center gap-2">
        <span>NZ Local Time: <strong id="nzClock" class="text-slate-200">--:--</strong></span>
        <span>•</span>
        <span id="resultCount" class="text-brand-emerald font-medium">Loading listings...</span>
      </div>
    </div>
  </section>

  <!-- STICKY FILTER PILLS -->
  <section class="bg-brand-dark/95 border-b border-slate-800 py-3 px-4">
    <div class="max-w-6xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar">
      <!-- Quick Status Toggle -->
      <button id="btnOpenNow" onclick="toggleOpenNow()" class="filter-pill shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-700 bg-brand-card text-slate-300 hover:border-brand-emerald transition flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Open Now
      </button>

      <span
